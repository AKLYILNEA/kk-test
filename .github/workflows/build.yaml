name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Static analysis
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "error|warning|info" analyze.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $rc

      - name: Unit & widget tests
        run: |
          set +e
          flutter test test packages/koneko_core/test 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -A 6 -E "EXCEPTION|overflowed|Assert|Expected|Actual|Failed|No .* found" test.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $rc

  build_android:
    name: Build Android (arm64-v8a)
    needs: [analyze_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android Release Signing
        env:
          KONEKO_SIGNING_JSON: ${{ secrets.koneko }}
        run: |
          if [ -z "$KONEKO_SIGNING_JSON" ]; then
            echo "::error::GitHub Secret 'koneko' is missing."
            exit 1
          fi
          STORE_PASSWORD=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.storePassword')
          KEY_PASSWORD=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.keyPassword')
          KEY_ALIAS=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.keyAlias')
          KEYSTORE_B64=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.keystoreBase64')

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_B64"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Build Android arm64 APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Koneko-${VERSION}-android-arm64.apk"

      - name: Verify APK Release Signature
        env:
          KONEKO_SIGNING_JSON: ${{ secrets.koneko }}
        run: |
          STORE_PASSWORD=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.storePassword')
          KEY_ALIAS=$(printf '%s' "$KONEKO_SIGNING_JSON" | jq -r '.keyAlias')
          echo "::add-mask::$STORE_PASSWORD"

          apk=$(ls dist/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          expected=$(keytool -list -v -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "keystore: $expected"
          echo "apk:      $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::$apk signature does not match release keystore."
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android-arm64
          path: ./dist
          overwrite: true

  build_windows:
    name: Build Windows (x64 EXE)
    needs: [analyze_and_test]
    runs-on: windows-2022
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Windows x64 Release
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. Portable ZIP containing Koneko.exe + runtime DLLs
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Koneko-$ver-windows-x64-portable.zip" -Force

          # 2. Standalone Windows x64 Setup EXE via Inno Setup
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "/DAppVersion=$ver" "windows\packaging\inno_setup.iss"
          } else {
            iscc "/DAppVersion=$ver" "windows\packaging\inno_setup.iss"
          }
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-x64
          path: ./dist
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [build_android, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koneko ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.exe
            dist/*.zip
