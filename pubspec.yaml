name: koneko
description: Koneko — Pure prism_ui cross-platform anime tracker & player (UI-First MVP, Kazumi core & Animeko UX ready).
publish_to: 'none'
version: 0.0.12+12

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  file_picker: ^13.3.3
  flutter_cache_manager: ^3.4.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  prism_ui:
    path: plugins/prism_ui
  koneko_contract:
    path: packages/koneko_contract
  koneko_core:
    path: packages/koneko_core

dev_dependencies:
  koneko_mock:
    path: packages/koneko_mock
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/about_bg.frag
    - shaders/about_title.frag
  assets:
    - assets/images/logo.svg
  fonts:
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
